<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fragment archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css?v=2" />
    <script src="scripts.js" defer></script>
    <script src="as-dithered-image.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="grid">
                <div class="grid-column category">
                    <as-dithered-image src="/Images/artefact.png" alt="Web artefacts"></as-dithered-image>
                    <a href="/web-artefacts.html" class="title">Web Artefacts</a>
                </div>
                <div class="grid-column category">
                    <as-dithered-image src="/Images/remedios.jpg" alt="JPGs"></as-dithered-image>
                    <a href="/jpgs.html" class="title">JPGs</a>
                </div>
                <div class="grid-column category">
                    <as-dithered-image src="/Images/insta.png" alt="Social Media"></as-dithered-image>
                    <a href="/socmed.html" class="title">Social Media</a>
                </div>
                <div class="grid-column category">
                    <as-dithered-image src="/Images/websitess.png" alt="Websites"></as-dithered-image>
                    <a href="/websites.html" class="title">Websites</a>
                </div>
                <div class="grid-column category">
                    <as-dithered-image src="/Images/pdfs.png" alt="PDFs"></as-dithered-image>
                    <a href="/pdfs.html" class="title">PDFs</a>
                </div>
                <div class="grid-column category" id="card-other">
                    <as-dithered-image src="/Images/other.png" alt="Other"></as-dithered-image>
                    <a href="/other.html" class="title">Other</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <p>fragment archive</p>
            <p>persistently archived web ephemera collected 2022 – ongoing</p>
            <nav>
                <a href="/index.html">home</a>
                <a href="/manifesto.html">manifesto</a>
                <a href="/info.html">info</a>
                <a href="/crawl.html">tech</a>
                <a href="/add.html">submit</a>
                <a href="/more.html">more</a>
            </nav>
        </div>
    </div>
    <script>
        // Hide any category card whose image fails to load
        document.querySelectorAll('as-dithered-image').forEach(el => {
            const src = el.getAttribute('src');
            if (!src) { el.closest('.category').style.display = 'none'; return; }
            const probe = new Image();
            probe.onerror = () => el.closest('.category').style.display = 'none';
            probe.src = src;
        });
    </script>
</body>
</html>
